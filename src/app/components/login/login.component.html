<div class="login-wrapper">
  <div class="card login-card">
    <h2 class="login-title gradient-text">Welcome Back</h2>
    <p class="login-subtitle">Sign in to view your measurement history</p>

    <div class="social-login">
      <asl-google-signin-button type="standard" size="large" [width]="300"></asl-google-signin-button>
    </div>

    <div class="divider">
      <span>OR</span>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" class="form-control" [(ngModel)]="username" name="username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
      </div>
      <button type="submit" class="btn-primary w-100">Sign In</button>
    </form>
  </div>
</div>
