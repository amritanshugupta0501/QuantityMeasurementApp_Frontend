<div class="history-wrapper">
  <div class="card history-card">
    <div class="history-header">
      <h2 class="history-title gradient-text">Measurement History</h2>
      
      <div class="filter-controls">
        <label>Filter by Operation:</label>
        <select class="form-control" [(ngModel)]="filterOperation" (change)="fetchHistory()">
          <option *ngFor="let op of operations" [value]="op">{{op}}</option>
        </select>
      </div>
    </div>

    <div class="table-responsive" *ngIf="historyData.length > 0; else noData">
      <table class="history-table">
        <thead>
          <tr>
            <th>Raw Data</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of historyData">
            <td><pre>{{ item | json }}</pre></td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #noData>
      <div class="no-data">
        <p>No history records found for {{filterOperation}} operation.</p>
      </div>
    </ng-template>
  </div>
</div>
